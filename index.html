<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حلويات البدري</title>
<style>
:root{--bg:#4a0a2a;--bg2:#5e1236;--card:#6b1a40;--gold:#d9b25a;--tx:#fff6e6;--mut:#e0bfa6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;padding-bottom:110px}
header{text-align:center;padding:22px 16px 10px;background:linear-gradient(180deg,#34061d,var(--bg))}
header h1{margin:0;color:var(--gold);font-size:28px;letter-spacing:1px}
header p{margin:4px 0 0;color:var(--mut);font-size:13px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 12px;box-shadow:0 4px 12px #0006}
.bar input{width:100%;padding:12px 16px;border-radius:26px;border:1px solid var(--gold);background:var(--bg2);color:var(--tx);font-size:16px;outline:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.tabs button{flex:none;padding:8px 16px;border-radius:20px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:14px;cursor:pointer}
.tabs button.on{background:var(--gold);color:#3a0720;font-weight:bold}
main{padding:0 12px;max-width:900px;margin:auto}
h2{color:var(--gold);margin:22px 4px 10px;font-size:21px;border-right:4px solid var(--gold);padding-right:10px;scroll-margin-top:130px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;justify-content:space-between;border:1px solid #ffffff14}
.card b{font-size:15px;line-height:1.4}
.card .new{background:#e0242d;color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;margin-right:4px}
.pr{color:var(--gold);font-weight:bold}.pr small{color:var(--mut);font-weight:normal}
.add,.qty button{border:0;cursor:pointer}
.add{background:var(--gold);color:#3a0720;padding:9px;border-radius:10px;font-weight:bold;font-size:14px}
.qty{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:10px;padding:3px}
.qty button{width:34px;height:34px;border-radius:8px;background:var(--gold);color:#3a0720;font-size:20px;font-weight:bold}
.qty span{font-weight:bold}
.empty{text-align:center;color:var(--mut);padding:40px}
#fl{position:fixed;inset:auto 0 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));z-index:6;transform:translateY(120%);transition:.25s}
#fl.show{transform:none}
#fl button{width:100%;max-width:900px;display:flex;justify-content:space-between;margin:auto;padding:15px 20px;border:0;border-radius:16px;background:var(--gold);color:#3a0720;font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 6px 20px #000a}
#ov,#pv{position:fixed;inset:0;background:#000a;z-index:9;display:none;align-items:flex-end;justify-content:center}
#ov.show,#pv.show{display:flex}
.sheet{background:var(--bg2);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 10px;color:var(--gold);display:flex;justify-content:space-between}
.sheet h3 button{background:none;border:0;color:var(--tx);font-size:24px;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff18}
.row{font-size:14px}.row .qty{width:120px}
.tot{display:flex;justify-content:space-between;font-size:19px;font-weight:bold;color:var(--gold);padding:12px 0}
.mode{display:flex;gap:8px;margin:6px 0 12px}
.mode button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:15px;cursor:pointer}
.mode button.on{background:var(--gold);color:#3a0720;font-weight:bold}
.f input,.f textarea{width:100%;margin-bottom:8px;padding:12px;border-radius:12px;border:1px solid #ffffff40;background:var(--bg);color:var(--tx);font:inherit;font-size:15px}
.send{width:100%;padding:15px;border:0;border-radius:14px;background:#25d366;color:#fff;font-size:18px;font-weight:bold;cursor:pointer;margin-top:6px}
.im{height:100px;border-radius:10px;overflow:hidden;background:#3a0720}.im img{width:100%;height:100%;object-fit:cover;display:block}.ph{display:flex;height:100%;align-items:center;justify-content:center;font-size:40px}
.im.big{height:200px}.im.sm{width:56px;height:56px;flex:none}.row .im.sm+div{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}.chips button{padding:9px 14px;border-radius:18px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:15px;cursor:pointer}.chips button.on{background:var(--gold);color:#3a0720;font-weight:bold}
.qty.big{margin:4px 0}.qty.big button{width:46px;height:46px}.qty.big span{font-size:20px}.qty span{cursor:pointer}.card.off{opacity:.55}.card.off .add{background:#7a5a60;color:#ddd;cursor:default}
</style>
</head>

let ALL=S.flatMap(s=>s.items);const cart={};let mode="in",term="",pk=null;

const KG=new Set(["كنافة","ملبن","قمرية وجوزية","حلويات شرقية","مشبك","هريسة","بسبوسة","بغاشة","بقلاوة"]);
const PC=/^(علبة|قرص|تورتة|ترت|مكرونة)/;

function pic(it){const n=it.n,s=it.s;let k;if(it.img)return`<img src="${it.img}" loading="lazy" alt="${n}">`;
if(s=="كنافة")k=/لف/.test(n)?"k2":/أساور/.test(n)?"k5":/ميكس|نوجا|شيكولاتة|كاجو|مدلعة|تمر/.test(n)?"k6":"k3";
else k={"ملبن":"m1","قمرية وجوزية":"q1","حلويات شرقية":"h1","مشبك":"mk","هريسة":"hr","بسبوسة":"bs","بغاشة":"bq","بقلاوة":"bq","علب مشكل":"bq"}[s];
if(s=="حلويات شرقية"&&/لديدة/.test(n))k="red";
if(s=="حلويات شرقية"&&/بسيمة|كعب|لينزا|رموش/.test(n))k="ck";
return k?`<img src="${IM[k]}" loading="lazy" alt="${n}">`:`<div class="ph">${/كرواسون|بريوش/.test(n)?"🥐":/دونات/.test(n)?"🍩":"🥮"}</div>`}
document.title=SHOP_NAME;$("shop").textContent="✦ "+SHOP_NAME+" ✦";
function tabs(){$("tabs").innerHTML=S.map(s=>`<button onclick="go(${s.i})" id="t${s.i}">${s.t}</button>`).join("")}tabs();
function go(i){$("q").value="";term="";render();setTimeout(()=>{document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("on"));$("t"+i).classList.add("on");$("s"+i).scrollIntoView()},30)}
function card(it){const q=cart[it.id],u=unit(it);return`<div class="card${it.na?" off":""}"><div class="im">${pic(it)}</div><b>${it.n}${it.nw?'<span class="new">جديد</span>':''}</b><div class="pr">${fmt(it.p)} <small>ج.م${u=="kg"?" / كجم":""}</small></div>${q?`<div class="qty"><button onclick="ch(${it.id},1)">+</button><span onclick="openPick(${it.id})">${ql(it,q)}</span><button onclick="ch(${it.id},-1)">−</button></div>`:(it.na?`<button class="add" disabled>غير متاح حاليًا</button>`:`<button class="add" onclick="openPick(${it.id})">+ إضافة للسلة</button>`)}</div>`}
function render(){const t=term.trim();let h="";
S.forEach(s=>{const its=t?s.items.filter(x=>x.n.includes(t)):s.items;if(its.length)h+=`<h2 id="s${s.i}">${s.t}</h2><div class="grid">${its.map(card).join("")}</div>`});
$("main").innerHTML=h||'<div class="empty">لا توجد نتائج مطابقة</div>';bar()}
function ch(i,d){const it=ALL[i-1];cart[i]=(cart[i]||0)+d*(unit(it)=="kg"?.5:1);if(cart[i]<=.01)delete cart[i];render();if($("ov").classList.contains("show"))openCart()}
const line=(it,q)=>Math.round(q*it.p);
function tot(){let c=0,m=0;for(const k in cart){c++;m+=line(ALL[k-1],cart[k])}return[c,m]}
function bar(){const[c,m]=tot();$("fl").classList.toggle("show",c>0);$("fc").textContent="🛒 عرض السلة ("+fmt(c)+" صنف)";$("ft").textContent=fmt(m)+" ج.م"}
function openPick(i){if(ALL[i-1].na)return;pk={id:i,q:cart[i]||1};drawPick();$("pv").classList.add("show")}
function drawPick(){const it=ALL[pk.id-1],kg=unit(it)=="kg",ch=kg?[.5,1,1.5,2,3,5]:[1,2,3,5,10];
$("ps").innerHTML=`<h3>${it.n}<button onclick="closePick()">×</button></h3><div class="im big">${pic(it)}</div><div class="pr" style="margin:8px 0">${fmt(it.p)} ج.م${kg?" / كجم":""}</div><div class="chips">${ch.map(v=>`<button class="${pk.q==v?"on":""}" onclick="setq(${v})">${kg?fmt(v)+" كجم":fmt(v)}</button>`).join("")}</div><div class="qty big"><button onclick="setq(pk.q+${kg?.25:1})">+</button><span>${ql(it,pk.q)}</span><button onclick="setq(pk.q-${kg?.25:1})">−</button></div><div class="tot"><span>السعر</span><span>${fmt(line(it,pk.q))} ج.م</span></div><button class="send" style="background:var(--gold);color:#3a0720" onclick="okPick()">${cart[pk.id]?"تحديث الكمية":"إضافة للسلة"}</button>`}
function setq(v){pk.q=Math.max(unit(ALL[pk.id-1])=="kg"?.25:1,v);drawPick()}
function closePick(){$("pv").classList.remove("show")}
function okPick(){cart[pk.id]=pk.q;closePick();render();if($("ov").classList.contains("show"))openCart()}
function openCart(){const[c,m]=tot();if(!c){closeCart();return}
$("sh").innerHTML=`<h3>🛒 سلة المشتريات<button onclick="closeCart()">×</button></h3>`+Object.keys(cart).map(k=>{const it=ALL[k-1];return`<div class="row"><div class="im sm">${pic(it)}</div><div><b>${it.n}</b><br><small>${fmt(line(it,cart[k]))} ج.م</small></div><div class="qty"><button onclick="ch(${k},1)">+</button><span>${ql(it,cart[k])}</span><button onclick="ch(${k},-1)">−</button></div></div>`}).join("")+
`<div class="tot"><span>الإجمالي</span><span>${fmt(m)} ج.م</span></div>
<div class="mode"><button class="${mode=="in"?"on":""}" onclick="setMode('in')">🍽️ داخل المحل</button><button class="${mode=="out"?"on":""}" onclick="setMode('out')">🛵 توصيل للمنزل</button></div>
<div class="f">${mode=="in"?'<input id="tb" placeholder="رقم الطاولة" inputmode="numeric">':'<input id="nm" placeholder="الاسم"><input id="ph" placeholder="رقم الموبايل" inputmode="tel"><textarea id="ad" rows="2" placeholder="العنوان بالتفصيل"></textarea>'}<textarea id="nt" rows="2" placeholder="ملاحظات على الطلب (اختياري)"></textarea></div>

function csv(t){const r=[];let w=[],f="",q=false;t=t.replace(/^\uFEFF/,"");for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==","){w.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;w.push(f);f="";if(w.some(x=>x.trim()))r.push(w);w=[]}else f+=c}w.push(f);if(w.some(x=>x.trim()))r.push(w);return r}

if(!n||!s||isNaN(p)||/^(مخفي|إخفاء|اخفاء|hide|hidden)$/i.test(a))return;
const it={id:++id,n,p,s,u:/كجم|كيلو|kg/i.test(g(cu))?"kg":"pc",na:/^(لا|no|false|0|غير متاح)$/i.test(a),nw:/^(نعم|جديد|new|yes)$/i.test(g(cj)),img:/^https?:\/\//.test(g(ci))?g(ci):""};
