<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>منيو</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- الهيدر: اللوجو (logo.png) واسم المحل (من config.js) -->
  <header>
    <img id="logo" src="logo.png" alt="logo">
    <h1 id="shop"></h1>
    <p>اطلب الآن عبر واتساب ✦ الأسعار بالجنيه المصري</p>
  </header>

  <!-- البحث وأزرار الأقسام -->
  <div class="bar">
    <input id="q" type="search" placeholder="🔍 ابحث عن صنف...">
    <div class="tabs" id="tabs"></div>
  </div>

  <!-- أماكن يملؤها app.js -->
  <main id="main"></main>

  <!-- شريط السلة العائم -->
  <div id="fl"><button onclick="openCart()"><span id="fc"></span><span id="ft"></span></button></div>

  <!-- نافذة اختيار الكمية -->
  <div id="pv"><div class="sheet" id="ps"></div></div>

  <!-- نافذة السلة وإتمام الطلب -->
  <div id="ov" onclick="if(event.target===this)closeCart()"><div class="sheet" id="sh"></div></div>

  <!-- ترتيب التحميل مهم: الإعدادات ثم البيانات ثم البرنامج -->
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
